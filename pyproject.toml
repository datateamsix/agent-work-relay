[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-work-relay"
version = "0.1.0"
description = "A durable agnostic work broker for routing work between AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Agent Work Relay contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
api = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1"]
cursor = ["httpx>=0.28,<1"]
firestore = ["google-cloud-firestore>=2.21,<3"]
auth = ["pyjwt[crypto]>=2.13,<3", "httpx>=0.28,<1"]
hosted = [
  "mcp[cli]>=2,<3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "google-cloud-firestore>=2.21,<3",
  "pyjwt[crypto]>=2.13,<3",
]
supabase = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]
security = ["pyyaml>=6,<7", "pillow>=11,<13", "pypdf>=5,<7"]

[project.scripts]
awr = "awr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
